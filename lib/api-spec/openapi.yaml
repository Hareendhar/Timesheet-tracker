openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Versatile Timesheet Portal API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication
  - name: employees
    description: Employee management
  - name: clients
    description: Client management
  - name: projects
    description: Project management
  - name: activities
    description: Activity category management
  - name: timesheets
    description: Timesheet management
  - name: notifications
    description: In-app notifications
  - name: audit
    description: Audit log
  - name: dashboard
    description: Dashboard statistics
  - name: search
    description: Global search
  - name: export
    description: Data export

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # AUTH
  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: Get current authenticated user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
        "401":
          description: Not authenticated

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Logout current user
      responses:
        "200":
          description: Logged out

  /auth/google:
    get:
      operationId: initiateGoogleOAuth
      tags: [auth]
      summary: Initiate Google OAuth 2.0 login flow
      description: Redirects the browser to Google's OAuth consent screen.
      responses:
        "302":
          description: Redirect to Google OAuth consent screen

  /auth/google/callback:
    get:
      operationId: googleOAuthCallback
      tags: [auth]
      summary: Google OAuth 2.0 callback handler
      description: >
        Handles the redirect from Google after the user grants or denies consent.
        On success, creates or updates the user session and redirects to the app.
        On failure, redirects to /login?error=<reason>.
      parameters:
        - name: code
          in: query
          required: false
          schema:
            type: string
          description: Authorization code returned by Google on success
        - name: state
          in: query
          required: false
          schema:
            type: string
          description: CSRF state token generated at login initiation
        - name: error
          in: query
          required: false
          schema:
            type: string
          description: Error code returned by Google on denial
      responses:
        "302":
          description: >
            Redirect to the app root on success, or to /login?error=<reason> on failure.

  # EMPLOYEES
  /employees:
    get:
      operationId: listEmployees
      tags: [employees]
      summary: List employees with pagination, sorting, and filtering
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, default: 20 }
        - name: search
          in: query
          schema: { type: string }
        - name: role
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { type: string }
        - name: department
          in: query
          schema: { type: string }
        - name: managerId
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Paginated list of employees
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmployeeList"
    post:
      operationId: createEmployee
      tags: [employees]
      summary: Create a new employee
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmployeeInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Employee"

  /employees/bulk-upload:
    post:
      operationId: bulkUploadEmployees
      tags: [employees]
      summary: Bulk upload employees from Excel/CSV
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkEmployeeUpload"
      responses:
        "200":
          description: Upload result with row-wise errors
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkUploadResult"

  /employees/{employeeId}:
    get:
      operationId: getEmployee
      tags: [employees]
      summary: Get employee by ID
      parameters:
        - name: employeeId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Employee
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Employee"
        "404":
          description: Not found
    patch:
      operationId: updateEmployee
      tags: [employees]
      summary: Update employee
      parameters:
        - name: employeeId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmployeeUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Employee"
    delete:
      operationId: deleteEmployee
      tags: [employees]
      summary: Delete (deactivate) employee
      parameters:
        - name: employeeId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Deleted

  /employees/{employeeId}/profile:
    get:
      operationId: getEmployeeProfile
      tags: [employees]
      summary: Get employee profile with metrics
      parameters:
        - name: employeeId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Employee profile with metrics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmployeeProfile"

  /employees/{employeeId}/direct-reports:
    get:
      operationId: getDirectReports
      tags: [employees]
      summary: Get direct reports of a manager
      parameters:
        - name: employeeId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: List of direct reports with stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagerProfile"

  # CLIENTS
  /clients:
    get:
      operationId: listClients
      tags: [clients]
      summary: List clients
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, default: 20 }
        - name: status
          in: query
          schema: { type: string }
        - name: search
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Paginated list of clients
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientList"
    post:
      operationId: createClient
      tags: [clients]
      summary: Create client
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"

  /clients/{clientId}:
    get:
      operationId: getClient
      tags: [clients]
      summary: Get client by ID
      parameters:
        - name: clientId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Client
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"
    patch:
      operationId: updateClient
      tags: [clients]
      summary: Update client
      parameters:
        - name: clientId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"
    delete:
      operationId: deleteClient
      tags: [clients]
      summary: Delete client
      parameters:
        - name: clientId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Deleted

  # PROJECTS
  /projects:
    get:
      operationId: listProjects
      tags: [projects]
      summary: List projects with pagination
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, default: 20 }
        - name: status
          in: query
          schema: { type: string }
        - name: clientId
          in: query
          schema: { type: string }
        - name: search
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Paginated list of projects
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectList"
    post:
      operationId: createProject
      tags: [projects]
      summary: Create project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"

  /projects/{projectId}:
    get:
      operationId: getProject
      tags: [projects]
      summary: Get project by ID
      parameters:
        - name: projectId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
    patch:
      operationId: updateProject
      tags: [projects]
      summary: Update project
      parameters:
        - name: projectId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
    delete:
      operationId: deleteProject
      tags: [projects]
      summary: Delete project
      parameters:
        - name: projectId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Deleted

  # ACTIVITY CATEGORIES
  /activities:
    get:
      operationId: listActivities
      tags: [activities]
      summary: List activity categories
      responses:
        "200":
          description: List of activity categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Activity"
    post:
      operationId: createActivity
      tags: [activities]
      summary: Create activity category
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActivityInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Activity"

  /activities/{activityId}:
    patch:
      operationId: updateActivity
      tags: [activities]
      summary: Update activity category
      parameters:
        - name: activityId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActivityUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Activity"
    delete:
      operationId: deleteActivity
      tags: [activities]
      summary: Delete activity category
      parameters:
        - name: activityId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Deleted

  # TIMESHEETS
  /timesheets:
    get:
      operationId: listTimesheets
      tags: [timesheets]
      summary: List timesheets with filters and pagination
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, default: 20 }
        - name: employeeId
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { type: string }
        - name: weekStartDate
          in: query
          schema: { type: string }
        - name: managerId
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Paginated list of timesheets
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimesheetList"
    post:
      operationId: createTimesheet
      tags: [timesheets]
      summary: Create or update a weekly timesheet draft
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TimesheetInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Timesheet"

  /timesheets/{timesheetId}:
    get:
      operationId: getTimesheet
      tags: [timesheets]
      summary: Get timesheet by ID
      parameters:
        - name: timesheetId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Timesheet with rows
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Timesheet"
    patch:
      operationId: updateTimesheet
      tags: [timesheets]
      summary: Update timesheet rows (draft only)
      parameters:
        - name: timesheetId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TimesheetUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Timesheet"

  /timesheets/{timesheetId}/submit:
    post:
      operationId: submitTimesheet
      tags: [timesheets]
      summary: Submit timesheet for approval
      parameters:
        - name: timesheetId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Timesheet"

  /timesheets/{timesheetId}/approve:
    post:
      operationId: approveTimesheet
      tags: [timesheets]
      summary: Approve a submitted timesheet
      parameters:
        - name: timesheetId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApprovalAction"
      responses:
        "200":
          description: Approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Timesheet"

  /timesheets/{timesheetId}/reject:
    post:
      operationId: rejectTimesheet
      tags: [timesheets]
      summary: Reject a submitted timesheet
      parameters:
        - name: timesheetId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RejectionAction"
      responses:
        "200":
          description: Rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Timesheet"

  /timesheets/bulk-action:
    post:
      operationId: bulkTimesheetAction
      tags: [timesheets]
      summary: Bulk approve or reject multiple timesheets
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkTimesheetAction"
      responses:
        "200":
          description: Bulk action result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkActionResult"

  /timesheets/copy-previous-week:
    post:
      operationId: copyPreviousWeek
      tags: [timesheets]
      summary: Copy previous week rows to new draft
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CopyWeekRequest"
      responses:
        "200":
          description: New timesheet with copied rows
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Timesheet"

  # NOTIFICATIONS
  /notifications:
    get:
      operationId: listNotifications
      tags: [notifications]
      summary: List notifications for current user
      parameters:
        - name: unreadOnly
          in: query
          schema: { type: boolean }
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, default: 20 }
      responses:
        "200":
          description: List of notifications
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationList"

  /notifications/{notificationId}/read:
    patch:
      operationId: markNotificationRead
      tags: [notifications]
      summary: Mark a notification as read
      parameters:
        - name: notificationId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Marked read

  /notifications/read-all:
    patch:
      operationId: markAllNotificationsRead
      tags: [notifications]
      summary: Mark all notifications as read
      responses:
        "200":
          description: All marked read

  # AUDIT LOG
  /audit-logs:
    get:
      operationId: listAuditLogs
      tags: [audit]
      summary: List audit logs with filters
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, default: 50 }
        - name: userId
          in: query
          schema: { type: string }
        - name: action
          in: query
          schema: { type: string }
        - name: role
          in: query
          schema: { type: string }
        - name: dateFrom
          in: query
          schema: { type: string }
        - name: dateTo
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Paginated audit logs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditLogList"

  # DASHBOARD
  /dashboard/stats:
    get:
      operationId: getDashboardStats
      tags: [dashboard]
      summary: Get global dashboard statistics
      responses:
        "200":
          description: Dashboard statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardStats"

  /dashboard/timesheet-status-breakdown:
    get:
      operationId: getTimesheetStatusBreakdown
      tags: [dashboard]
      summary: Timesheet counts grouped by status
      responses:
        "200":
          description: Status breakdown
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimesheetStatusBreakdown"

  /dashboard/recent-activity:
    get:
      operationId: getRecentActivity
      tags: [dashboard]
      summary: Recent timesheet activity feed
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 10 }
      responses:
        "200":
          description: Recent activity
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityFeedItem"

  /dashboard/compliance-overview:
    get:
      operationId: getComplianceOverview
      tags: [dashboard]
      summary: Weekly compliance rates by department
      responses:
        "200":
          description: Compliance overview
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ComplianceItem"

  /dashboard/my-stats:
    get:
      operationId: getDashboardMyStats
      tags: [dashboard]
      summary: Employee-scoped dashboard stats (own timesheets only)
      responses:
        "200":
          description: Personal timesheet summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyDashboardStats"
        "401":
          description: Not authenticated

  # SEARCH
  /search:
    get:
      operationId: globalSearch
      tags: [search]
      summary: Global search across employees, projects, clients
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Search results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResults"

  # EXPORT
  /export/employees:
    get:
      operationId: exportEmployees
      tags: [export]
      summary: Export employees as CSV/Excel
      parameters:
        - name: format
          in: query
          schema: { type: string, enum: [csv, excel], default: csv }
      responses:
        "200":
          description: File download
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary

  /export/timesheets:
    get:
      operationId: exportTimesheets
      tags: [export]
      summary: Export timesheets as CSV/Excel
      parameters:
        - name: format
          in: query
          schema: { type: string, enum: [csv, excel], default: csv }
        - name: dateFrom
          in: query
          schema: { type: string }
        - name: dateTo
          in: query
          schema: { type: string }
      responses:
        "200":
          description: File download
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary

  /export/audit-logs:
    get:
      operationId: exportAuditLogs
      tags: [export]
      summary: Export audit logs as CSV/Excel
      parameters:
        - name: format
          in: query
          schema: { type: string, enum: [csv, excel], default: csv }
        - name: dateFrom
          in: query
          schema: { type: string }
        - name: dateTo
          in: query
          schema: { type: string }
      responses:
        "200":
          description: File download
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    CurrentUser:
      type: object
      properties:
        id:
          type: string
        employeeId:
          type: string
        name:
          type: string
        email:
          type: string
        role:
          type: string
        department:
          type: ["string", "null"]
        designation:
          type: ["string", "null"]
        managerId:
          type: ["string", "null"]
        avatarUrl:
          type: ["string", "null"]
      required: [id, employeeId, name, email, role]

    Employee:
      type: object
      properties:
        id:
          type: string
        employeeId:
          type: string
        name:
          type: string
        email:
          type: string
        department:
          type: string
        designation:
          type: string
        role:
          type: string
          enum: [Employee, Manager, Admin]
        managerId:
          type: ["string", "null"]
        managerName:
          type: ["string", "null"]
        status:
          type: string
          enum: [Active, Inactive]
        createdAt:
          type: string
        updatedAt:
          type: string
      required: [id, employeeId, name, email, department, designation, role, status, createdAt, updatedAt]

    EmployeeInput:
      type: object
      properties:
        employeeId:
          type: string
        name:
          type: string
        email:
          type: string
        department:
          type: string
        designation:
          type: string
        role:
          type: string
          enum: [Employee, Manager, Admin]
        managerId:
          type: ["string", "null"]
        status:
          type: string
          enum: [Active, Inactive]
      required: [employeeId, name, email, department, designation, role, status]

    EmployeeUpdate:
      type: object
      properties:
        name:
          type: string
        department:
          type: string
        designation:
          type: string
        role:
          type: string
          enum: [Employee, Manager, Admin]
        managerId:
          type: ["string", "null"]
        status:
          type: string
          enum: [Active, Inactive]

    EmployeeList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Employee"
        total:
          type: integer
        page:
          type: integer
        pageSize:
          type: integer
      required: [data, total, page, pageSize]

    EmployeeProfile:
      type: object
      properties:
        employee:
          $ref: "#/components/schemas/Employee"
        metrics:
          $ref: "#/components/schemas/EmployeeMetrics"
